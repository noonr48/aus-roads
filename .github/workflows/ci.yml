name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  build:
    name: Build and test (ubuntu-latest, JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Privacy audit (merged manifests)
        run: ./tools/privacy-audit/run.sh

      - name: Static analysis (detekt)
        working-directory: android
        run: ./gradlew detekt

      - name: Unit tests
        working-directory: android
        # `test` runs every module's unit tests across both flavors — the flavored
        # app's tests are testOfflineDebugUnitTest / testWithNetworkDebugUnitTest,
        # which the old `testDebugUnitTest` target silently skipped.
        run: ./gradlew test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aus-roads-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
